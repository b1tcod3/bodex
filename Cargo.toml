[package]
name = "bodex"
version = "0.1.0"
edition = "2021"

[features]
default = ["desktop"]
desktop = ["slint/std", "slint/compat-1-2", "slint/renderer-software", "slint/backend-winit"]

[dependencies]
slint = { version = "1.15.1", default-features = false, features = ["backend-winit"] }
rusqlite = { version = "0.29.0", features = ["bundled", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
bcrypt = "0.15"
lazy_static = "1.5.0"
tokio = { version = "1", features = ["full"] }
regex = "1.10"
once_cell = "1.19.0"


[build-dependencies]
slint-build = "1.15.1"


[[bin]]
name = "bodex_bin"
path = "src/main.rs"

